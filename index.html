<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calcolo Raggio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calcolo Raggio</title>
<style>
:root { color-scheme: light; --green:#123b32; --bg:#f3f6f4; --muted:#63736c; }
* { box-sizing:border-box; }
body { margin:0; padding:calc(22px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:#17231e; min-height:100vh; }
main { max-width:460px; margin:0 auto; }
header { text-align:center; margin:10px 0 28px; }
.logo { width:58px;height:58px;margin:0 auto 12px;border-radius:18px;background:var(--green);color:white;display:grid;place-items:center;font-size:30px;font-weight:700; }
h1 { margin:0; font-size:28px; letter-spacing:-.6px; }
.subtitle { margin:8px 0 0;color:var(--muted);font-size:14px; }
.panel { background:white;border-radius:22px;padding:20px;box-shadow:0 5px 22px #173a2b0c; }
.field { margin-bottom:20px; }
label { display:block;font-size:14px;font-weight:650;margin-bottom:9px; }
.controls { display:flex;gap:9px; }
input,select { min-width:0;height:52px;border:1px solid #d6dfda;border-radius:13px;background:white;font:inherit;font-size:17px;padding:0 12px;color:#17231e; }
input { flex:1;width:0; }
select { width:122px; }
.result { margin-top:5px;border-radius:18px;background:#edf5f0;padding:19px 14px;text-align:center; }
.result-label { color:#53665c;font-size:12px;font-weight:750;letter-spacing:1.2px; }
#result { margin-top:7px;font-size:clamp(29px,8vw,40px);font-weight:750;letter-spacing:-1px;color:var(--green);overflow-wrap:anywhere; }
#hint { margin-top:8px;font-size:12px;color:var(--muted);min-height:16px; }
button { width:100%;height:52px;border:0;border-radius:14px;background:var(--green);color:white;font-size:16px;font-weight:700;margin-top:16px; }
.note { font-size:12px;line-height:1.5;color:var(--muted);margin:17px 4px 0;text-align:center; }
.formula { font-size:12px;color:var(--muted);text-align:center;margin-top:16px; }
</style>
</head>
<body>
<main>
<header>
<div class="logo" aria-hidden="true">R</div>
<h1>Calcolo Raggio</h1>
<p class="subtitle">Inserisci la corda e la freccia al centro</p>
</header>
<section class="panel" aria-label="Calcolatore">
<div class="field">
<label for="chord">Lunghezza della corda</label>
<div class="controls">
<input id="chord" type="number" min="0" step="any" inputmode="decimal" placeholder="Es. 10" value="10">
<select id="chordUnit" aria-label="Unità corda">
<option value="m">Metri</option><option value="cm">Centimetri</option><option value="mm">Millimetri</option>
</select>
</div>
</div>
<div class="field">
<label for="sagitta">Freccia a metà corda</label>
<div class="controls">
<input id="sagitta" type="number" min="0" step="any" inputmode="decimal" placeholder="Es. 100" value="100">
<select id="sagittaUnit" aria-label="Unità freccia">
<option value="mm" selected>Millimetri</option><option value="cm">Centimetri</option><option value="m">Metri</option>
</select>
</div>
</div>
<div class="result" aria-live="polite">
<div class="result-label">RAGGIO CALCOLATO</div>
<div id="result">125,05 m</div>
<div id="hint">Risultato in metri</div>
</div>
<button id="reset" type="button">Nuovo calcolo</button>
</section>
<p class="note">Il calcolo avviene sul dispositivo. Dopo aver aperto e aggiunto l'app alla schermata Home, il calcolo non richiede una connessione Internet.</p>
<p class="formula">Formula: R = C² / (8f) + f / 2</p>
</main>
<script>
const chord = document.getElementById('chord');
const sagitta = document.getElementById('sagitta');
const chordUnit = document.getElementById('chordUnit');
const sagittaUnit = document.getElementById('sagittaUnit');
const result = document.getElementById('result');
const hint = document.getElementById('hint');
const factors = {m:1, cm:0.01, mm:0.001};
function fmt(n) {
  return n.toLocaleString('it-IT', {maximumFractionDigits: 6});
}
function calculate() {
  const cRaw = Number(chord.value), fRaw = Number(sagitta.value);
  if (!chord.value.trim() || !sagitta.value.trim() || !Number.isFinite(cRaw) || !Number.isFinite(fRaw) || cRaw <= 0 || fRaw <= 0) {
    result.textContent = '—';
    hint.textContent = 'Inserisci valori maggiori di zero';
    return;
  }
  const c = cRaw * factors[chordUnit.value];
  const f = fRaw * factors[sagittaUnit.value];
  if (f >= c) {
    result.textContent = '—';
    hint.textContent = 'La freccia deve essere minore della corda';
    return;
  }
  const r = (c*c)/(8*f) + f/2;
  result.textContent = fmt(r) + ' m';
  hint.textContent = 'Raggio in metri';
}
[chord,sagitta,chordUnit,sagittaUnit].forEach(el => el.addEventListener('input', calculate));
document.getElementById('reset').addEventListener('click', () => {
  chord.value = '';
  sagitta.value = '';
  chordUnit.value = 'm';
  sagittaUnit.value = 'mm';
  calculate();
  chord.focus();
});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
calculate();
</script>
</body>
</html>
